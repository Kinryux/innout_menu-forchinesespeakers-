<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>妈妈的 In-N-Out 点餐</title>

<!-- PWA: manifest, icon, theme colors, standalone mode -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ed1c24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="妈妈点餐">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fraunces:ital,wght@1,500;1,600&family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --innout-red: #ed1c24;
    --innout-red-deep: #b8141a;
    --innout-yellow: #ffd21f;
    --innout-cream: #fff8ec;
    --ink: #1a1a1a;
    --paper: #fdfaf2;
    --muted: #5a4e3d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  /* Prevent double-tap-to-zoom on buttons, checkboxes, and interactive areas
     (pinch-to-zoom still works for accessibility) */
  button, label, input, .mod-chip, .cat-btn, .qty-btn, .tab,
  .cart-bar-btn, .add-btn, .modal-close, .mod-toggle,
  .show-mode-save, .show-mode-close, .remove-btn,
  .item-card, .item-actions, .category-nav {
    touch-action: manipulation;
  }

  html, body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans SC', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    font-size: 18px;
  }

  .header {
    background: var(--innout-red);
    color: #fff;
    padding: 16px 16px 20px;
    text-align: center;
    border-bottom: 5px solid var(--ink);
  }

  .header-brand {
    font-family: 'Fraunces', 'Bebas Neue', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--innout-yellow);
    letter-spacing: 3px;
    margin-bottom: 4px;
    text-transform: uppercase;
    opacity: 0.95;
  }

  .header h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: 38px;
    font-weight: 900;
    line-height: 1.1;
    text-shadow: 2px 2px 0 var(--ink);
    letter-spacing: 2px;
  }

  .category-nav {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    padding: 14px;
    background: var(--ink);
    position: sticky;
    top: 0;
    z-index: 50;
    border-bottom: 4px solid var(--innout-yellow);
  }

  .cat-btn {
    padding: 14px 8px;
    background: #fff;
    color: var(--ink);
    border: 3px solid var(--innout-yellow);
    border-radius: 6px;
    font-family: 'Noto Serif SC', serif;
    font-weight: 900;
    font-size: 22px;
    cursor: pointer;
    letter-spacing: 1px;
    line-height: 1.1;
  }

  .cat-btn small {
    display: block;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    color: var(--innout-red);
    letter-spacing: 2px;
    margin-top: 4px;
    font-weight: normal;
  }

  .cat-btn.active {
    background: var(--innout-red);
    color: #fff;
    border-color: #fff;
  }
  .cat-btn.active small { color: var(--innout-yellow); }

  main {
    max-width: 700px;
    margin: 0 auto;
    padding: 18px 14px 180px;
  }

  .instruction-box {
    background: var(--innout-yellow);
    border: 3px solid var(--ink);
    padding: 16px;
    margin-bottom: 20px;
    font-family: 'Noto Serif SC', serif;
    font-weight: 700;
    font-size: 20px;
    line-height: 1.5;
    border-radius: 6px;
  }

  .instruction-box .step {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin: 6px 0;
  }

  .step-num {
    background: var(--innout-red);
    color: #fff;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    flex-shrink: 0;
  }

  .panel { display: none; }
  .panel.active { display: block; }

  .section-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 28px;
    font-weight: 900;
    color: var(--innout-red-deep);
    border-bottom: 4px solid var(--ink);
    padding-bottom: 8px;
    margin: 10px 0 18px;
  }

  .item-card {
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 8px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 5px 5px 0 var(--ink);
  }

  .item-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .item-zh {
    font-family: 'Noto Serif SC', serif;
    font-weight: 900;
    font-size: 28px;
    line-height: 1.15;
    color: var(--ink);
  }

  .item-en {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 1.5px;
    color: var(--innout-red-deep);
    margin-top: 4px;
  }

  .item-desc {
    font-size: 16px;
    color: var(--muted);
    margin-top: 8px;
    line-height: 1.4;
    font-weight: 500;
  }

  .item-price {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    background: var(--innout-yellow);
    padding: 4px 14px;
    border: 3px solid var(--ink);
    white-space: nowrap;
    line-height: 1;
  }

  .mod-toggle {
    width: 100%;
    background: var(--innout-cream);
    border: 2px solid var(--innout-red);
    padding: 12px;
    border-radius: 6px;
    margin-top: 10px;
    font-family: 'Noto Serif SC', serif;
    font-weight: 700;
    font-size: 17px;
    color: var(--innout-red-deep);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .mod-toggle .arrow {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    transition: transform 0.2s;
  }

  .mod-toggle.open .arrow {
    transform: rotate(180deg);
  }

  .mod-section {
    display: none;
    background: var(--innout-cream);
    border: 2px dashed var(--innout-red);
    padding: 12px 14px;
    border-radius: 6px;
    margin-top: 8px;
  }

  .mod-section.open {
    display: block;
  }

  .mod-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .mod-chip {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 6px;
    cursor: pointer;
    font-size: 17px;
    user-select: none;
    font-family: 'Noto Serif SC', serif;
    font-weight: 700;
  }

  .mod-chip input {
    accent-color: var(--innout-red);
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    cursor: pointer;
  }

  .mod-chip:has(input:checked) {
    background: var(--innout-red);
    color: #fff;
  }

  .choice-group { margin-top: 10px; }
  .mod-section .choice-group:first-child { margin-top: 0; }
  .mod-section .choice-group + .mod-list,
  .mod-section .choice-group + .choice-group { margin-top: 12px; }

  .choice-label {
    font-family: 'Noto Serif SC', serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--innout-red-deep);
    margin-bottom: 6px;
  }

  .choice-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }

  .choice-price {
    display: block;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px;
    letter-spacing: 1px;
    margin-top: 2px;
    font-weight: normal;
  }

  .choice-chip {
    position: relative;
    justify-content: center;
    text-align: center;
    padding: 10px 4px;
    font-size: 17px;
    min-width: 0;
    line-height: 1.2;
  }

  /* Radio circle hidden; the red highlight shows the selection */
  .choice-chip input {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
    pointer-events: none;
  }

  .choice-chip:has(input:focus-visible) {
    outline: 3px solid var(--innout-yellow);
    outline-offset: 2px;
  }

  .mod-chip .mod-en {
    display: block;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    opacity: 0.8;
    letter-spacing: 1px;
    margin-top: 2px;
    font-weight: normal;
  }

  .item-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    align-items: stretch;
  }

  .qty-control {
    display: flex;
    align-items: center;
    border: 3px solid var(--ink);
    border-radius: 6px;
    overflow: hidden;
    background: #fff;
  }

  .qty-btn {
    width: 50px;
    height: 54px;
    border: none;
    background: var(--innout-cream);
    font-weight: 900;
    font-size: 28px;
    cursor: pointer;
    font-family: 'Bebas Neue', sans-serif;
  }
  .qty-btn:active { background: var(--innout-yellow); }

  .qty-val {
    width: 50px;
    text-align: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    border: none;
    background: #fff;
    outline: none;
    height: 54px;
  }

  .add-btn {
    flex: 1;
    background: var(--innout-red);
    color: #fff;
    border: 3px solid var(--ink);
    padding: 10px 16px;
    border-radius: 6px;
    font-family: 'Noto Serif SC', serif;
    font-weight: 900;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--ink);
    line-height: 1.2;
  }

  .add-btn:active {
    transform: translate(4px, 4px);
    box-shadow: 0 0 0 var(--ink);
  }

  .cart-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--ink);
    color: #fff;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 5px solid var(--innout-yellow);
    z-index: 100;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.3);
    gap: 12px;
  }

  .cart-bar-info { display: flex; flex-direction: column; }

  .cart-bar-count {
    font-family: 'Noto Serif SC', serif;
    font-weight: 900;
    font-size: 18px;
  }

  .cart-bar-total {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    color: var(--innout-yellow);
  }

  .cart-bar-btn {
    background: var(--innout-red);
    color: #fff;
    border: 3px solid var(--innout-yellow);
    padding: 14px 20px;
    border-radius: 6px;
    font-family: 'Noto Serif SC', serif;
    font-weight: 900;
    cursor: pointer;
    font-size: 19px;
    line-height: 1.15;
  }

  .cart-bar-btn small {
    display: block;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    font-weight: normal;
    color: var(--innout-yellow);
    margin-top: 2px;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 200;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }

  .modal-overlay.active { display: flex; }

  .modal {
    background: var(--paper);
    width: 100%;
    max-width: 700px;
    max-height: 92vh;
    border-top-left-radius: 18px;
    border-top-right-radius: 18px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border: 4px solid var(--ink);
    border-bottom: none;
  }

  .modal-head {
    background: var(--innout-red);
    color: #fff;
    padding: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 4px solid var(--ink);
  }

  .modal-head h2 {
    font-family: 'Noto Serif SC', serif;
    font-size: 26px;
    font-weight: 900;
  }

  .modal-head h2 small {
    display: block;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 2px;
    opacity: 0.95;
    font-weight: normal;
    margin-top: 2px;
  }

  .modal-close {
    background: var(--innout-yellow);
    color: var(--ink);
    border: 3px solid var(--ink);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 22px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modal-body {
    overflow-y: auto;
    padding: 18px;
    flex: 1;
  }

  .cart-empty {
    text-align: center;
    padding: 50px 20px;
    color: var(--muted);
  }

  .cart-empty .big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 56px;
    color: var(--innout-red);
    letter-spacing: 3px;
  }

  .cart-empty p {
    font-size: 18px;
    font-weight: 700;
    margin-top: 6px;
  }

  .cart-item {
    border: 3px solid var(--ink);
    padding: 14px;
    margin-bottom: 12px;
    background: #fff;
    box-shadow: 4px 4px 0 var(--ink);
    border-radius: 6px;
  }

  .cart-item-name {
    font-family: 'Noto Serif SC', serif;
    font-weight: 900;
    font-size: 22px;
    line-height: 1.2;
  }

  .cart-item-en {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 17px;
    color: var(--innout-red-deep);
    letter-spacing: 1px;
    margin-top: 4px;
  }

  .cart-item-mods {
    font-size: 16px;
    color: var(--ink);
    margin-top: 8px;
    line-height: 1.5;
    padding: 8px 10px;
    border-left: 4px solid var(--innout-yellow);
    background: var(--innout-cream);
    font-weight: 600;
  }

  .cart-item-ctrl {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
  }

  .cart-item-price {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    color: var(--innout-red-deep);
  }

  .remove-btn {
    background: #fff;
    border: 2px solid var(--innout-red);
    color: var(--innout-red);
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
    font-family: 'Noto Serif SC', serif;
    font-weight: 700;
  }

  .cart-totals {
    border-top: 4px dashed var(--ink);
    margin-top: 16px;
    padding-top: 14px;
  }

  .cart-total-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 18px;
    font-weight: 700;
  }

  .price-note {
    font-size: 14px;
    color: var(--muted);
    text-align: center;
    margin-top: 10px;
    font-weight: 600;
  }

  .cart-total-row.big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    margin-top: 8px;
    padding-top: 10px;
    border-top: 3px solid var(--ink);
  }

  .modal-footer {
    padding: 14px;
    background: var(--innout-cream);
    border-top: 3px solid var(--ink);
    display: flex;
    gap: 10px;
  }

  .modal-footer button {
    flex: 1;
    padding: 16px 10px;
    border: 3px solid var(--ink);
    border-radius: 6px;
    font-family: 'Noto Serif SC', serif;
    font-weight: 900;
    cursor: pointer;
    font-size: 17px;
    line-height: 1.2;
  }

  .btn-clear { background: #fff; color: var(--ink); }
  .btn-show { background: var(--innout-yellow); color: var(--ink); }
  .btn-show:active { background: var(--innout-red); color: #fff; }

  .show-mode {
    position: fixed;
    inset: 0;
    background: var(--paper);
    z-index: 300;
    display: none;
    flex-direction: column;
    overflow-y: auto;
  }

  .show-mode.active { display: flex; }

  .show-mode-head {
    background: var(--innout-red);
    color: #fff;
    padding: 6px 14px;
    text-align: center;
    border-bottom: 3px solid var(--ink);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .show-mode-head h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 2px;
  }

  .show-mode-head p {
    display: none;
  }

  .show-body-wrap {
    padding: 4px 8px;
    flex: 1;
  }

  .show-line {
    padding: 5px 4px;
    border-bottom: 1px dashed #ccc;
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }

  .show-line:last-child {
    border-bottom: none;
  }

  .show-line .line-num-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 12px;
    letter-spacing: 0.5px;
    color: #fff;
    background: var(--innout-red);
    padding: 1px 6px;
    border-radius: 3px;
    font-weight: normal;
    flex-shrink: 0;
    min-width: 26px;
    text-align: center;
    margin-top: 3px;
  }

  .show-line-content {
    flex: 1;
    min-width: 0;
  }

  .show-line .en {
    font-family: 'Bebas Neue', sans-serif;
    font-weight: 700;
    font-size: 19px;
    line-height: 1.1;
    letter-spacing: 0.5px;
  }

  .show-line .mods-en {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    color: var(--innout-red-deep);
    margin-top: 1px;
    line-height: 1.15;
    letter-spacing: 0.5px;
  }

  .show-line .zh {
    display: none;
  }

  .togo-banner {
    background: var(--innout-yellow);
    border: 2px solid var(--ink);
    border-radius: 5px;
    padding: 5px 10px;
    margin: 2px 0 4px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 2px 2px 0 var(--innout-red);
  }

  .togo-icon {
    font-size: 22px;
    line-height: 1;
    flex-shrink: 0;
  }

  .togo-text { flex: 1; }

  .togo-en {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 19px;
    letter-spacing: 2px;
    color: var(--ink);
    line-height: 1;
  }

  .togo-sub {
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 11px;
    color: var(--innout-red-deep);
    font-weight: 700;
    margin-top: 1px;
  }

  .thank-you {
    background: var(--innout-cream);
    border: 1.5px dashed var(--innout-red);
    border-radius: 5px;
    padding: 6px 10px;
    margin-top: 6px;
    text-align: center;
  }

  .thank-you-hearts {
    font-size: 14px;
    letter-spacing: 5px;
    margin-bottom: 2px;
  }

  .thank-you-en {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 12px;
    color: var(--ink);
    font-weight: 600;
    line-height: 1.2;
  }

  .thank-you-zh {
    display: none;
  }

  .thank-you-sub {
    display: none;
  }

  .show-total {
    background: var(--innout-yellow);
    border: 4px solid var(--ink);
    margin: 18px 12px;
    padding: 16px;
    text-align: center;
    border-radius: 8px;
  }

  .show-total .total-en {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    letter-spacing: 1px;
  }

  .show-total .total-zh {
    font-family: 'Noto Serif SC', serif;
    font-size: 16px;
    color: var(--muted);
    margin-top: 4px;
    font-weight: 600;
  }

  .show-mode-footer {
    position: sticky;
    bottom: 0;
    display: flex;
    gap: 2px;
    background: var(--ink);
    border-top: 2px solid var(--innout-yellow);
  }

  .show-mode-save {
    flex: 1.3;
    background: var(--innout-red);
    color: #fff;
    border: none;
    padding: 10px 8px;
    font-family: 'Noto Serif SC', serif;
    font-weight: 900;
    font-size: 16px;
    cursor: pointer;
    border-right: 2px solid var(--innout-yellow);
  }

  .show-mode-save:active {
    background: var(--innout-red-deep);
  }

  .show-mode-save:disabled {
    opacity: 0.6;
    cursor: wait;
  }

  .show-mode-close {
    flex: 1;
    background: var(--ink);
    color: #fff;
    border: none;
    padding: 10px 8px;
    font-family: 'Noto Serif SC', serif;
    font-weight: 900;
    font-size: 14px;
    cursor: pointer;
  }

  /* Preview modal for the generated image */
  .photo-preview-overlay {

<body>

<header class="header">
  <div class="header-brand">In-N-Out</div>
  <h1>妈妈的点餐单</h1>
</header>

<nav class="category-nav" id="tabs"></nav>

<main>
  <div class="instruction-box">
    <div class="step">
      <div class="step-num">1</div>
      <div>选菜单,按红色 <span style="color:var(--innout-red-deep);">"+ 加入购物车"</span></div>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <div>按下面 <span style="color:var(--innout-red-deep);">"查看订单"</span> 确认</div>
    </div>
    <div class="step">
      <div class="step-num">3</div>
      <div>按 <span style="color:var(--innout-red-deep);">"给店员看"</span>,把手机给店员</div>
    </div>
    <div class="step" style="margin-top:8px;padding-top:8px;border-top:2px dashed var(--ink);">
      <div class="step-num" style="background:var(--ink);">📸</div>
      <div style="font-size:17px;">也可以按 <span style="color:var(--innout-red-deep);">"存图"</span> 保存到相册,下次直接给店员看</div>
    </div>
  </div>

  <div id="panels"></div>
</main>

<div class="cart-bar">
  <div class="cart-bar-info">
    <span class="cart-bar-count" id="cartCount">购物车: 0 件</span>
    <span class="cart-bar-total" id="cartTotal">$0.00</span>
  </div>
  <button class="cart-bar-btn" onclick="openCart()">
    查看订单
    <small>VIEW ORDER</small>
  </button>
</div>

<div class="modal-overlay" id="cartModal">
  <div class="modal">
    <div class="modal-head">
      <h2>我的订单<small>MY ORDER</small></h2>
      <button class="modal-close" onclick="closeCart()">✕</button>
    </div>
    <div class="modal-body" id="cartBody"></div>
    <div class="modal-footer">
      <button class="btn-clear" onclick="clearCart()">清空</button>
      <button class="btn-show" onclick="showOrderSheet()">给店员看 ▶</button>
    </div>
  </div>
</div>

<div class="show-mode" id="showMode">
  <div class="show-mode-head">
    <h1>MY ORDER, PLEASE</h1>
    <p>请给店员看 · Show to cashier</p>
  </div>
  <div class="show-body-wrap">
    <div id="showBody"></div>
  </div>
  <div class="show-mode-footer">
    <button class="show-mode-save" onclick="savePhoto()">📸 存图</button>
    <button class="show-mode-close" onclick="hideShowMode()">← 返回</button>
  </div>
</div>

<div class="photo-preview-overlay" id="photoPreview">
  <img id="photoPreviewImg" alt="订单">
  <div class="photo-preview-msg" id="photoPreviewMsg"></div>
  <div class="photo-preview-actions">
    <button id="photoShareBtn" onclick="sharePhoto()">📤 分享/存图</button>
    <button class="btn-close-preview" onclick="closePhotoPreview()">关闭</button>
  </div>
</div>

<div class="toast" id="toast">✓ 已加入</div>

<script src="html2canvas.min.js"></script>

<script>
  // Prices: from the 2026 drive-thru menu board photo. Secret-menu items aren't
  // on the board, so their prices are estimates (marked "est." below).
  const PRICES_UPDATED = "2026年11月";
  // Drink sizes from the board (soft drinks, iced tea, lemonade)
  const DRINK_PRICES = { small: 2.30, medium: 2.45, large: 2.65, xlarge: 2.85 };
  // Sales tax for 14620 E Gale Ave, Hacienda Heights 91745 (unincorporated LA County)
  const TAX_RATE = 0.0975;

  const menu = {
    burgers: {
      zh: "汉堡", en: "BURGERS",
      items: [
        { id: "dbldbl", zh: "双层双层 (最受欢迎)", en: "Double-Double", desc: "两片肉饼 + 两片芝士 + 生菜 + 番茄 + 洋葱 + 酱", price: 6.35, mods: "burger" },
        { id: "cheese", zh: "芝士汉堡", en: "Cheeseburger", desc: "一片肉饼 + 一片芝士 + 生菜 + 番茄 + 洋葱 + 酱", price: 4.40, mods: "burger" },
        { id: "hamburger", zh: "汉堡包 (无芝士)", en: "Hamburger", desc: "一片肉饼 + 生菜 + 番茄 + 洋葱 + 酱", price: 3.85, mods: "burger" },
        { id: "3x3", zh: "三层三层", en: "3x3", desc: "三片肉饼 + 三片芝士", secret: true, price: 8.35, mods: "burger" },
        { id: "4x4", zh: "四层四层", en: "4x4", desc: "四片肉饼 + 四片芝士", secret: true, price: 10.35, mods: "burger" },
        { id: "protein", zh: "生菜包双层 (低碳)", en: "Protein Style Double-Double", desc: "用生菜代替面包", secret: true, price: 6.35, mods: "burger" },
        { id: "grilled", zh: "素食芝士堡 (无肉)", en: "Grilled Cheese", desc: "只有芝士和蔬菜,没有肉", secret: true, price: 3.85, mods: "burger" }
      ]
    },
    sides: {
      zh: "薯条 / 套餐", en: "FRIES / COMBO",
      items: [
        { id: "fries", zh: "薯条", en: "French Fries", desc: "现切新鲜土豆", price: 2.40, mods: "fries" },
        { id: "animalfries", zh: "野兽薯条", en: "Animal Style Fries", desc: "薯条 + 芝士 + 炒洋葱 + 酱", secret: true, price: 4.60, mods: "none" },
        { id: "cheesefries", zh: "芝士薯条", en: "Cheese Fries", desc: "薯条加芝士", secret: true, price: 3.50, mods: "none" },
        { id: "combo1", zh: "1号套餐 (双层双层)", en: "Combo #1 — Double-Double", desc: "双层双层 + 薯条 + 饮料", price: 11.20, mods: "burger" },
        { id: "combo2", zh: "2号套餐 (芝士汉堡)", en: "Combo #2 — Cheeseburger", desc: "芝士汉堡 + 薯条 + 饮料", price: 9.25, mods: "burger" },
        { id: "combo3", zh: "3号套餐 (汉堡包)", en: "Combo #3 — Hamburger", desc: "汉堡包 + 薯条 + 饮料", price: 8.70, mods: "burger" }
      ]
    },
    drinks: {
      zh: "饮料", en: "DRINKS",
      items: [
        { id: "coke", zh: "可乐", en: "Coke", price: DRINK_PRICES.medium, mods: "drink" },
        { id: "cherrycoke", zh: "樱桃可乐", en: "Cherry Coke", price: DRINK_PRICES.medium, mods: "drink" },
        { id: "diet", zh: "健怡可乐 (无糖)", en: "Diet Coke", price: DRINK_PRICES.medium, mods: "drink" },
        { id: "7up", zh: "七喜 (像雪碧)", en: "7 Up", price: DRINK_PRICES.medium, mods: "drink" },
        { id: "drpepper", zh: "胡椒博士", en: "Dr Pepper", price: DRINK_PRICES.medium, mods: "drink" },
        { id: "rootbeer", zh: "沙士 (根汁汽水)", en: "Root Beer", price: DRINK_PRICES.medium, mods: "drink" },
        { id: "icedtea", zh: "冰茶 (无糖)", en: "Iced Tea", price: DRINK_PRICES.medium, mods: "drink" },
        { id: "lemonade", zh: "粉红柠檬水", en: "Pink Lemonade", price: DRINK_PRICES.medium, mods: "drink" },
        { id: "litelemonade", zh: "低糖粉红柠檬水", en: "Lite Pink Lemonade", price: DRINK_PRICES.medium, mods: "drink" },
        { id: "arnold", zh: "茶加柠檬水", en: "Arnold Palmer — half tea half lemonade", secret: true, price: DRINK_PRICES.medium, mods: "drink" },
        { id: "milk", zh: "牛奶", en: "Milk", price: 1.25, mods: "none" },
        { id: "coffee", zh: "咖啡", en: "Coffee", price: 1.65, mods: "none" },
        { id: "cocoa", zh: "热可可", en: "Hot Cocoa", price: 2.45, mods: "none" },
        { id: "water", zh: "水 (免费)", en: "Water Cup — free", price: 0, mods: "none" }
      ]
    },
    shakes: {
      zh: "奶昔", en: "SHAKES",
      items: [
        { id: "van", zh: "香草奶昔", en: "Vanilla Shake", price: 3.20, mods: "none" },
        { id: "choc", zh: "巧克力奶昔", en: "Chocolate Shake", price: 3.20, mods: "none" },
        { id: "straw", zh: "草莓奶昔", en: "Strawberry Shake", price: 3.20, mods: "none" },
        { id: "neo", zh: "三色奶昔 (三种口味)", en: "Neapolitan Shake — all three flavors", secret: true, price: 3.20, mods: "none" },
        { id: "blackwhite", zh: "黑白奶昔", en: "Black & White Shake — chocolate and vanilla", secret: true, price: 3.20, mods: "none" }
      ]
    }
  };

  const modSets = {
    burger: {
      zh: "想改一下吗? (可不选)",
      // Pick-one groups. The default option is pre-selected. Options with
      // en: null print nothing on the cashier sheet (it's the normal way).
      // "visible" groups are shown on the card without opening the ⚙️ section.
      choices: [
        { id: "onion", zh: "洋葱", en: "ONIONS", visible: true, options: [
          { id: "raw", zh: "要生洋葱", en: "With Onions", default: true },
          { id: "grilled", zh: "要炒洋葱", en: "Grilled Onions" },
          { id: "none", zh: "不要洋葱", en: "No Onions" }
        ]},
        { id: "spread", zh: "酱", en: "SPREAD", options: [
          { id: "normal", zh: "正常酱", en: null, default: true },
          { id: "none", zh: "不要酱", en: "No Spread" },
          { id: "extra", zh: "多加酱", en: "Extra Spread" }
        ]}
      ],
      options: [
        { id: "animal", zh: "野兽风 (加料更好吃)", en: "Animal Style" },
        { id: "no_tomato", zh: "不要番茄", en: "No Tomato" },
        { id: "protein_mod", zh: "生菜包 (不要面包)", en: "Protein Style — lettuce wrap" },
        { id: "chopped_chilis", zh: "加辣椒", en: "Add Chopped Chilis" }
      ]
    },
    drink: {
      choices: [
        { id: "size", zh: "大小", en: "SIZE", visible: true, options: [
          { id: "small", zh: "小杯", en: "Small", price: DRINK_PRICES.small },
          { id: "medium", zh: "中杯", en: "Medium", price: DRINK_PRICES.medium, default: true },
          { id: "large", zh: "大杯", en: "Large", price: DRINK_PRICES.large },
          { id: "xlarge", zh: "特大杯", en: "X-Large", price: DRINK_PRICES.xlarge }
        ]}
      ],
      options: []
    },
    fries: {
      zh: "想改一下吗? (可不选)",
      options: [
        { id: "well_fries", zh: "多煎一下 (更脆)", en: "Well Done" },
        { id: "light", zh: "少煎一下 (软一点)", en: "Light Well" },
        { id: "animal_style_fries", zh: "加野兽料", en: "Animal Style" },
        { id: "cheese_only", zh: "加芝士", en: "Add Cheese" }
      ]
    }
  };

  const state = { currentTab: "burgers", cart: [] };

  const tabsEl = document.getElementById("tabs");
  const panelsEl = document.getElementById("panels");

  Object.entries(menu).forEach(([key, cat], i) => {
    const btn = document.createElement("button");
    btn.className = "cat-btn" + (i === 0 ? " active" : "");
    btn.dataset.tab = key;
    btn.innerHTML = `${cat.zh}<small>${cat.en}</small>`;
    btn.onclick = () => selectTab(key);
    tabsEl.appendChild(btn);

    const panel = document.createElement("div");
    panel.className = "panel" + (i === 0 ? " active" : "");
    panel.id = "panel-" + key;

    const title = document.createElement("div");
    title.className = "section-title";
    title.innerHTML = `${cat.zh} · ${cat.en}`;
    panel.appendChild(title);

    cat.items.forEach(item => panel.appendChild(renderItem(item)));
    panelsEl.appendChild(panel);
  });

  function renderItem(item) {
    const card = document.createElement("div");
    card.className = "item-card";
    card.dataset.itemId = item.id;

    const secretBadge = item.secret ? '<span class="secret-badge">隐藏菜单</span>' : '';
    const hasMods = item.mods !== "none";

    card.innerHTML = `
      <div class="item-head">
        <div style="flex:1;">
          <div class="item-zh">${item.zh}${secretBadge}</div>
          <div class="item-en">${item.en}</div>
        </div>
        <div class="item-price">$${item.price.toFixed(2)}</div>
      </div>
      ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ''}
      ${hasMods ? renderModToggle(item) : ''}
      <div class="item-actions">
        <div class="qty-control">
          <button class="qty-btn" onclick="changeQty('${item.id}', -1)">−</button>
          <input class="qty-val" id="qty-${item.id}" type="text" value="1" readonly>
          <button class="qty-btn" onclick="changeQty('${item.id}', 1)">+</button>
        </div>
        <button class="add-btn" onclick="addToCart('${item.id}')">+ 加入购物车</button>
      </div>
    `;
    return card;
  }

  function renderChoiceGroup(item, group) {
    const opts = group.options.map(o =>
      `<label class="mod-chip choice-chip">
        <input type="radio" name="${item.id}-${group.id}" data-item="${item.id}" data-choice="${group.id}" value="${o.id}"${o.default ? " checked" : ""}${o.price != null ? ` onchange="updateCardPrice('${item.id}')"` : ""}>
        <span>${o.zh}${o.en ? `<span class="mod-en">${o.en}</span>` : ""}${o.price != null ? `<span class="choice-price">$${o.price.toFixed(2)}</span>` : ""}</span>
      </label>`
    ).join("");
    // 4 options (drink sizes) go 2×2 so they stay readable on a phone
    const cols = group.options.length > 3 ? 2 : group.options.length;
    return `<div class="choice-group">
      <div class="choice-label">${group.zh} · ${group.en}</div>
      <div class="choice-row" style="grid-template-columns: repeat(${cols}, 1fr);">${opts}</div>
    </div>`;
  }

  // Price of an item with its currently picked options (e.g. drink size)
  function currentPrice(item) {
    let price = item.price;
    const modSet = modSets[item.mods];
    (modSet && modSet.choices || []).forEach(group => {
      const picked = document.querySelector(`input[name="${item.id}-${group.id}"]:checked`);
      const opt = group.options.find(o => o.id === (picked ? picked.value : null));
      if (opt && opt.price != null) price = opt.price;
    });
    return price;
  }

  function updateCardPrice(itemId) {
    const item = findItem(itemId);
    const el = document.querySelector(`[data-item-id="${itemId}"] .item-price`);
    if (item && el) el.textContent = `$${currentPrice(item).toFixed(2)}`;
  }

  function renderModToggle(item) {
    const mods = modSets[item.mods];
    if (!mods) return '';
    const choices = mods.choices || [];
    const visible = choices.filter(g => g.visible).map(g => renderChoiceGroup(item, g)).join("");
    const hidden = choices.filter(g => !g.visible).map(g => renderChoiceGroup(item, g)).join("");
    const opts = mods.options.map(m =>
      `<label class="mod-chip">
        <input type="checkbox" data-item="${item.id}" data-mod="${m.id}"${m.id === "animal" ? ` onchange="onAnimalToggle(this)"` : ""}>
        <span>${m.zh}<span class="mod-en">${m.en}</span></span>
      </label>`
    ).join("");
    if (!opts && !hidden) return visible;
    return `
      ${visible}
      <button class="mod-toggle" onclick="toggleMods(this)">
        <span>⚙️ ${mods.zh}</span>
        <span class="arrow">▼</span>
      </button>
      <div class="mod-section">
        ${hidden}
        <div class="mod-list">${opts}</div>
      </div>
    `;
  }

  // Animal Style already comes with grilled onions, so switch raw → grilled.
  // (Animal Style + No Onions is still allowed.)
  function onAnimalToggle(cb) {
    if (!cb.checked) return;
    const raw = document.querySelector(`input[name="${cb.dataset.item}-onion"][value="raw"]`);
    const grilled = document.querySelector(`input[name="${cb.dataset.item}-onion"][value="grilled"]`);
    if (raw && raw.checked && grilled) grilled.checked = true;
  }

  function toggleMods(btn) {
    btn.classList.toggle("open");
    btn.nextElementSibling.classList.toggle("open");
  }

  function selectTab(key) {
    state.currentTab = key;
    document.querySelectorAll(".cat-btn").forEach(t => t.classList.toggle("active", t.dataset.tab === key));
    document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + key));
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function changeQty(itemId, delta) {
    const input = document.getElementById("qty-" + itemId);
    let v = parseInt(input.value) + delta;
    if (v < 1) v = 1;
    if (v > 20) v = 20;
    input.value = v;
  }

  function findItem(id) {
    for (const cat of Object.values(menu)) {
      const found = cat.items.find(i => i.id === id);
      if (found) return found;
    }
    return null;
  }

  function addToCart(itemId) {
    const item = findItem(itemId);
    if (!item) return;
    const qty = parseInt(document.getElementById("qty-" + itemId).value) || 1;

    const modSet = modSets[item.mods];
    const modChecks = document.querySelectorAll(`input[type="checkbox"][data-item="${itemId}"]:checked`);
    const selectedMods = [];
    if (modSet) {
      // Order on the sheet: Animal Style, then pick-one groups (onions are
      // always printed so the cashier doesn't have to ask), then the rest.
      const checked = Array.from(modChecks).sort((a, b) =>
        (b.dataset.mod === "animal") - (a.dataset.mod === "animal"));
      const animalFirst = checked.length && checked[0].dataset.mod === "animal" ? [checked.shift()] : [];
      animalFirst.forEach(cb => {
        const mod = modSet.options.find(o => o.id === cb.dataset.mod);
        if (mod) selectedMods.push({ zh: mod.zh, en: mod.en });
      });
      (modSet.choices || []).forEach(group => {
        const picked = document.querySelector(`input[name="${itemId}-${group.id}"]:checked`);
        const opt = group.options.find(o => o.id === (picked ? picked.value : null))
                 || group.options.find(o => o.default);
        if (opt && opt.en) selectedMods.push({ zh: opt.zh, en: opt.en });
      });
      checked.forEach(cb => {
        const mod = modSet.options.find(o => o.id === cb.dataset.mod);
        if (mod) selectedMods.push({ zh: mod.zh, en: mod.en });
      });
    }

    state.cart.push({
      uid: Date.now() + Math.random(),
      id: item.id,
      zh: item.zh,
      en: item.en,
      qty,
      price: currentPrice(item),
      mods: selectedMods
    });

    document.getElementById("qty-" + itemId).value = 1;
    modChecks.forEach(cb => cb.checked = false);
    if (modSet) {
      (modSet.choices || []).forEach(group => {
        const def = group.options.find(o => o.default);
        const el = def && document.querySelector(`input[name="${itemId}-${group.id}"][value="${def.id}"]`);
        if (el) el.checked = true;
      });
      updateCardPrice(itemId);
    }
    const card = document.querySelector(`[data-item-id="${itemId}"]`);
    if (card) {
      const toggle = card.querySelector(".mod-toggle");
      const section = card.querySelector(".mod-section");
      if (toggle) toggle.classList.remove("open");
      if (section) section.classList.remove("open");
    }

    updateCartBar();
    showToast(`✓ ${item.zh} 已加入`);
  }

  function updateCartBar() {
    const count = state.cart.reduce((s, i) => s + i.qty, 0);
    const total = state.cart.reduce((s, i) => s + i.qty * i.price, 0);
    document.getElementById("cartCount").textContent = `购物车: ${count} 件`;
    document.getElementById("cartTotal").textContent = `$${total.toFixed(2)}`;
  }

  function openCart() {
    renderCartBody();
    document.getElementById("cartModal").classList.add("active");
  }

  function closeCart() {
    document.getElementById("cartModal").classList.remove("active");
  }

  function renderCartBody() {
    const body = document.getElementById("cartBody");
    if (state.cart.length === 0) {
      body.innerHTML = `<div class="cart-empty">
        <div class="big">EMPTY</div>
        <p>购物车是空的</p>
        <p style="font-size:15px; margin-top:4px;">请先选择菜单</p>
      </div>`;
      return;
    }

    const subtotal = state.cart.reduce((s, i) => s + i.qty * i.price, 0);
    const tax = subtotal * TAX_RATE;
    const total = subtotal + tax;

    let html = "";
    state.cart.forEach(ci => {
      const modsHtml = ci.mods.length
        ? `<div class="cart-item-mods">${ci.mods.map(m => `• ${m.zh}`).join("<br>")}</div>`
        : "";
      html += `<div class="cart-item">
        <div class="cart-item-name">${ci.zh} × ${ci.qty}</div>
        <div class="cart-item-en">${ci.en}</div>
        ${modsHtml}
        <div class="cart-item-ctrl">
          <div class="cart-item-price">$${(ci.qty * ci.price).toFixed(2)}</div>
          <button class="remove-btn" onclick="removeItem('${ci.uid}')">删除</button>
        </div>
      </div>`;
    });

    html += `<div class="cart-totals">
      <div class="cart-total-row"><span>小计</span><span>$${subtotal.toFixed(2)}</span></div>
      <div class="cart-total-row"><span>税 (${(TAX_RATE * 100).toFixed(2)}% 洛杉矶县)</span><span>$${tax.toFixed(2)}</span></div>
      <div class="cart-total-row big"><span>总计</span><span>$${total.toFixed(2)}</span></div>
      <div class="price-note">价格来自店内菜单 (${PRICES_UPDATED}),隐藏菜单的价格是估计的</div>
    </div>`;

    body.innerHTML = html;
  }

  function removeItem(uid) {
    state.cart = state.cart.filter(i => String(i.uid) !== String(uid));
    updateCartBar();
    renderCartBody();
  }

  function clearCart() {
    if (state.cart.length === 0) return;
    if (!confirm("确定要清空吗?")) return;
    state.cart = [];
    updateCartBar();
    renderCartBody();
  }

  function showOrderSheet() {
    if (state.cart.length === 0) {
      alert("购物车是空的");
      return;
    }
    const body = document.getElementById("showBody");
    let html = `
      <div class="togo-banner">
        <div class="togo-icon">🥡</div>
        <div class="togo-text">
          <div class="togo-en">TO-GO, PLEASE</div>
          <div class="togo-sub">Not eating in vehicle · 不在车上吃</div>
        </div>
      </div>
    `;
    state.cart.forEach((ci, idx) => {
      const modsEn = ci.mods.length
        ? `<div class="mods-en">▸ ${ci.mods.map(m => m.en).join("<br>▸ ")}</div>`
        : "";
      html += `<div class="show-line">
        <div class="line-num-label">${idx + 1}</div>
        <div class="show-line-content">
          <div class="en">${ci.qty} × ${ci.en}</div>
          ${modsEn}
        </div>
      </div>`;
    });

    html += `
      <div class="thank-you">
        <div class="thank-you-hearts">🌟 💛 🌟</div>
        <div class="thank-you-en">Thank you so much for your patience and kindness!</div>
        <div class="thank-you-zh">非常感谢您的耐心和帮助!</div>
        <div class="thank-you-sub">Have a wonderful day 祝您愉快</div>
      </div>
    `;

    body.innerHTML = html;
    closeCart();
    document.getElementById("showMode").classList.add("active");
    window.scrollTo(0, 0);
  }

  function hideShowMode() {
    document.getElementById("showMode").classList.remove("active");
  }

  // ============ PHOTO EXPORT ============
  let currentPhotoBlob = null;

  async function savePhoto() {
    const saveBtn = document.querySelector(".show-mode-save");
    const originalText = saveBtn.textContent;
    saveBtn.disabled = true;
    saveBtn.textContent = "⏳ 生成中...";

    try {
      // Build a dedicated off-screen capture element that contains
      // the same content as the cashier view but without any scrolling
      // or fixed-position tricks that confuse html2canvas
      const src = document.getElementById("showBody").innerHTML;
      const capture = document.createElement("div");
      capture.style.cssText = `
        position: fixed;
        top: -10000px;
        left: 0;
        width: 400px;
        background: #fdfaf2;
        padding: 0;
        font-family: 'Noto Sans SC', system-ui, sans-serif;
      `;
      capture.innerHTML = `
        <div style="background:#ed1c24;color:#fff;padding:10px 14px;text-align:center;border-bottom:3px solid #1a1a1a;">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;">MY ORDER, PLEASE</div>
        </div>
        <div style="padding:8px 10px;">${src}</div>
        <div style="background:#1a1a1a;color:#fff;text-align:center;padding:8px;font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:2px;">
          妈妈的 IN-N-OUT 点餐 · ${new Date().toLocaleDateString("zh-CN")}
        </div>
      `;
      document.body.appendChild(capture);

      // Wait a frame for layout
      await new Promise(r => requestAnimationFrame(r));

      const canvas = await html2canvas(capture, {
        backgroundColor: "#fdfaf2",
        scale: 2, // 2x resolution for crisp photo
        useCORS: true,
        allowTaint: false,
        logging: false,
        width: capture.offsetWidth,
        height: capture.offsetHeight
      });

      document.body.removeChild(capture);

      // Convert to blob
      canvas.toBlob((blob) => {
        if (!blob) {
          alert("生成图片失败,请再试一次");
          saveBtn.disabled = false;
          saveBtn.textContent = originalText;
          return;
        }
        currentPhotoBlob = blob;
        const url = URL.createObjectURL(blob);
        document.getElementById("photoPreviewImg").src = url;

        const msgEl = document.getElementById("photoPreviewMsg");
        const shareBtn = document.getElementById("photoShareBtn");

        if (navigator.share && navigator.canShare) {
          msgEl.innerHTML = "<strong>订单图片已生成 ✓</strong>点下面按钮保存到相册或分享";
          shareBtn.textContent = "📤 分享/存图";
        } else {
          msgEl.innerHTML = "<strong>订单图片已生成 ✓</strong>点下面按钮下载图片";
          shareBtn.textContent = "💾 下载";
        }

        document.getElementById("photoPreview").classList.add("active");
        saveBtn.disabled = false;
        saveBtn.textContent = originalText;
      }, "image/png", 0.95);
    } catch (err) {
      console.error("Photo generation error:", err);
      alert("生成图片失败: " + err.message);
      saveBtn.disabled = false;
      saveBtn.textContent = originalText;
    }
  }

  async function sharePhoto() {
    if (!currentPhotoBlob) return;

    const filename = `innout-order-${new Date().toISOString().slice(0,10)}.png`;
    const file = new File([currentPhotoBlob], filename, { type: "image/png" });

    // Try native share first (iOS/Android) — this opens the share sheet
    // which includes "Save Image" option that puts it in Photos/Gallery
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({
          files: [file],
          title: "In-N-Out 订单"
        });
        return;
      } catch (err) {
        // User cancelled or share failed — fall through to download
        if (err.name === "AbortError") return;
        console.log("Share failed, falling back to download:", err);
      }
    }

    // Fallback: trigger download
    const url = URL.createObjectURL(currentPhotoBlob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast("✓ 图片已下载");
  }

  function closePhotoPreview() {
    document.getElementById("photoPreview").classList.remove("active");
    const img = document.getElementById("photoPreviewImg");
    if (img.src) {
      URL.revokeObjectURL(img.src);
      img.src = "";
    }
    currentPhotoBlob = null;
  }
  // ============ END PHOTO EXPORT ============

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._timeout);
    t._timeout = setTimeout(() => t.classList.remove("show"), 2000);
  }

  document.getElementById("cartModal").addEventListener("click", e => {
    if (e.target.id === "cartModal") closeCart();
  });

  updateCartBar();

  // Register service worker for offline use (PWA)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js')
        .then(reg => console.log('SW registered:', reg.scope))
        .catch(err => console.log('SW registration failed:', err));
    });
  }
</script>
</body>
</html>
